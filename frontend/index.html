<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Ornament Similarity Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <!-- Header -->
        <header class="page-header" style="position: relative;">
            <a href="/admin" class="admin-link" style="position: absolute; right: 20px; top: 20px; color: #111; background: #FFD700; text-decoration: none; font-weight: 700; font-size: 1rem; padding: 8px 16px; border: 2px solid #FFD700; border-radius: 6px; transition: all 0.3s; z-index: 10;">Admin Panel</a>
            <h1>Gold Ornament Similarity Search</h1>
            <div class="header-divider">
                <div class="line"></div>
                <div class="diamond"></div>
                <div class="line"></div>
            </div>
        </header>

        <!-- Workflow Section -->
        <div class="workflow-container">
            <!-- 1. Upload -->
            <div class="action-card glass-card">
                <h3 class="step-title">1. Upload Image</h3>
                <label class="drop-zone" id="dropZone" for="imageInput">
                    <input id="imageInput" type="file" accept="image/*" hidden>
                    <div class="upload-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <span class="action-title">Upload Image</span>
                    <span class="action-subtitle">Drag & drop or click to select<br>JPG, PNG, WebP</span>
                </label>
            </div>

            <!-- Arrow 1 -->
            <div class="workflow-arrow">→</div>

            <!-- 2. Preview -->
            <div class="action-card glass-card">
                <h3 class="step-title">2. Uploaded Image</h3>
                <div class="preview-zone empty" id="uploadedPreview"></div>
            </div>

            <!-- Arrow 2 -->
            <div class="workflow-arrow">→</div>

            <!-- 3. Search -->
            <div class="action-card glass-card search-card">
                <h3 class="step-title">3. Search</h3>
                <div class="search-btn-wrapper">
                    <button id="searchBtn" type="button" class="search-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span>Search AI</span>
                    </button>
                    <p class="search-desc">Find similar gold ornaments<br>using AI similarity search</p>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-container">
            <p class="status-text" id="statusText">Upload an image to begin.</p>
        </div>

        <!-- Info Bar (Hidden initially) -->
        <div class="info-bar glass-card" id="infoBar" style="display: none;">
            <div class="info-item">
                <div class="info-icon">🏷️</div>
                <div class="info-text">
                    <span class="info-label">Category</span>
                    <span class="info-value" id="infoCategory">-</span>
                </div>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <div class="info-icon">🏆</div>
                <div class="info-text">
                    <span class="info-label">Best Match</span>
                    <span class="info-value" id="infoBestMatch">-</span>
                </div>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <div class="info-icon">🖼️</div>
                <div class="info-text">
                    <span class="info-label">Found</span>
                    <span class="info-value" id="infoResults">-</span>
                </div>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <div class="info-icon">⏱️</div>
                <div class="info-text">
                    <span class="info-label">Search Time</span>
                    <span class="info-value" id="infoTime">-</span>
                </div>
            </div>
        </div>

        <!-- Results: Exact Match -->
        <div id="exactSection" class="results-section" style="display: none;">
            <div class="section-divider">
                ✨ Exact Match ✨
            </div>
            <div class="results-grid" id="exactResultsList"></div>
        </div>

        <!-- Results: Similar -->
        <div id="similarSection" class="results-section" style="display: none;">
            <div class="section-divider">
                ✨ Similar Results ✨
            </div>
            <div class="results-grid" id="similarResultsList"></div>
        </div>
    </main>

    <!-- Result Template -->
    <template id="resultTemplate">
        <div class="result-card">
            <div class="image-wrapper">
                <img class="result-image" alt="Ornament Result">
            </div>
            <div class="badge-wrapper">
                <span class="gold-badge result-score"></span>
            </div>
        </div>
    </template>

    <script src="script.js?v=7"></script>
</body>
</html>
